<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProgramaDora — post</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Figtree:ital,wght@0,400;0,500;0,700;1,400&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="aurora" aria-hidden="true"><span></span></div>

<header class="topo">
  <div class="topo__inner">
    <a class="logo" href="index.html">programa<em>dora</em></a>
    <nav class="topo__nav" aria-label="Navegação principal">
      <a href="index.html#posts">posts</a>
      <a href="index.html#sobre">sobre</a>
      <a href="index.html#cursos">cursos</a>
      <a href="index.html#participe">participe</a>
      <a href="index.html#faq">dúvidas</a>
    </nav>
  </div>
</header>

<div class="post-wrap">
  <a class="post-back" href="index.html">← voltar para o início</a>
  <article class="post-paper" id="post-paper">
    <p class="feed__loading">carregando…</p>
  </article>
</div>

<footer class="footer">
  <div class="footer__inner">
    <span class="footer__brand">programa<em class="grad-animado">dora</em></span>
    <nav class="footer__links" aria-label="Links do rodapé">
      <a href="index.html#posts">posts</a>
      <a href="privacidade.html">privacidade</a>
      <a href="feed.xml">rss</a>
    </nav>
    <p class="footer__small">© <span id="ano">2026</span> ProgramaDora — Isadora Rocha Vieira.
    Conteúdo automático identificado e verificado 2x por IA.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="js/main.js"></script>
<script>
(function () {
  'use strict';
  var paper = document.getElementById('post-paper');
  var slug = new URLSearchParams(location.search).get('p');

  if (!slug || !/^[a-z0-9-]+$/.test(slug)) {
    paper.innerHTML = '<h1>post não encontrado</h1><p>Esse link parece quebrado. <a href="index.html">Voltar ao início</a>.</p>';
    return;
  }

  function fmtData(iso) {
    return new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
  }

  Promise.all([
    fetch('posts/index.json').then(function (r) { return r.json(); }),
    fetch('posts/' + slug + '.md').then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
  ]).then(function (res) {
    var meta = res[0].find(function (p) { return p.slug === slug; }) || {};
    var md = res[1];
    document.title = 'ProgramaDora — ' + (meta.title || slug);

    var metaHtml = '<div class="post-meta">' +
      '<span class="card__emoji">' + (meta.emoji || '📄') + '</span>' +
      '<span>' + (meta.date ? fmtData(meta.date) : '') + (meta.hora && /h$/.test(meta.hora) ? ' · edição das ' + meta.hora : '') + '</span>' +
      (meta.verificado ? '<span class="card__stamp">✓✓ verificado 2x</span>' : '') +
      '</div>';

    paper.innerHTML = metaHtml + marked.parse(md);
  }).catch(function () {
    paper.innerHTML = '<h1>post não encontrado</h1><p>Talvez a próxima edição ainda esteja no forno. <a href="index.html">Voltar ao início</a>.</p>';
  });
})();
</script>
</body>
</html>
